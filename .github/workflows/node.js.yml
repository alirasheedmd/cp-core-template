name: Continuous Deployment

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  deployment:
    runs-on: prod

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
      S3_BUCKET_ACCESS_KEY: ${{ secrets.S3_BUCKET_ACCESS_KEY }}
      S3_BUCKET_SECRET_KEY: ${{ secrets.S3_BUCKET_SECRET_KEY }}
      NEXT_PUBLIC_S3_BUCKET_NAME: ${{ secrets.NEXT_PUBLIC_S3_BUCKET_NAME }}
      NEXT_PUBLIC_S3_BUCKET_REGION: ${{ secrets.NEXT_PUBLIC_S3_BUCKET_REGION }}
      NEXT_PUBLIC_S3_URL: ${{ secrets.NEXT_PUBLIC_S3_URL }}
      NEXT_PUBLIC_IMGIX_URL: ${{ secrets.NEXT_PUBLIC_IMGIX_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build

        run: npm run build

      - name: Restart application
        if: github.event_name == 'push'
        run: pm2 restart cp-core-template

      - name: Verify application health
        if: github.event_name == 'push'
        run: >-
          curl --fail --silent --show-error
          --retry 5 --retry-delay 3 --retry-connrefused
          http://127.0.0.1:3010/
